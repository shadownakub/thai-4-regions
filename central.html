<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ภาคกลาง</title>
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Kanit:wght@300;400;600&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
body{margin:0;background:#FFFDF7;font-family:Sarabun,sans-serif;color:#2D3748}
nav{background:#fff;padding:14px;text-align:center;position:sticky;top:0;box-shadow:0 2px 8px #0002}
nav a{margin:0 10px;text-decoration:none;color:#333;font-family:Kanit}
.hero{background:#4DA6FF;color:white;padding:70px 20px;text-align:center}
h1{font-family:Chonburi}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;padding:25px}
.card{background:white;border-radius:16px;padding:18px;box-shadow:0 2px 10px #0002;cursor:pointer}
#map{height:350px;margin:20px;border-radius:12px}
.modal{display:none;position:fixed;inset:0;background:#0008}
.modal-content{background:white;max-width:600px;margin:10% auto;padding:20px;border-radius:12px}
button{background:#4DA6FF;color:white;border:0;padding:8px 14px;border-radius:8px}
</style>
</head>
<body>
<nav>
<a href="index.html">หน้าแรก</a>
<a href="north.html">เหนือ</a>
<a href="central.html">กลาง</a>
<a href="south.html">ใต้</a>
<a href="isan.html">อีสาน</a>
</nav>
<div class="hero">
<h1>ภาคกลาง</h1>
<p>ศูนย์กลางประเทศไทย</p>
</div>
<div class="cards">
<div class="card" onclick="openModal('อยุธยา')"><h3>อยุธยา</h3><p>มรดกโลก</p></div>
<div class="card" onclick="openModal('พระนคร')"><h3>พระนคร</h3><p>วัดสำคัญ</p></div>
<div class="card" onclick="openModal('ตลาดน้ำ')"><h3>ตลาดน้ำ</h3><p>วิถีไทย</p></div>
</div>
<div id="map"></div>
<div class="modal" id="m">
<div class="modal-content">
<h2 id="mt"></h2>
<p>ตัวอย่างหน้าต่าง Modal สำหรับแสดงรายละเอียดสถานที่</p>
<button onclick="closeModal()">ปิด</button>
</div></div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
function openModal(t){document.getElementById('mt').innerText=t;document.getElementById('m').style.display='block';}
function closeModal(){document.getElementById('m').style.display='none';}
var map=L.map('map').setView([14.35,100.57],6);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
L.marker([14.35,100.57]).addTo(map).bindPopup('ภาคกลาง');
</script>
</body></html>
